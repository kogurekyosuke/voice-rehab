<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="声文字">
<meta name="theme-color" content="#F8F5EE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>声文字</title>
<style>
:root{--ink:#25303B;--muted:#82909D;--paper:#EEF3F6;--card:#FFFFFF;--teal:#16B9C9;--teal2:#26C6B2;--teal-dark:#0A95A8;--orange:#FF8A3D;--navy:#2E3846;--line:#E2EAF0;--shadow:0 14px 30px rgba(45,56,70,.12)}
*{box-sizing:border-box;margin:0;padding:0}html{width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100%;background:linear-gradient(180deg,#F7FAFC 0%,var(--paper) 38%,#E7EEF3 100%);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;-webkit-tap-highlight-color:transparent;color:var(--ink);font-size:16px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 18% 7%,rgba(22,185,201,.16),transparent 26%),radial-gradient(circle at 90% 18%,rgba(255,138,61,.10),transparent 24%);pointer-events:none}
button,textarea{font:inherit}button{touch-action:manipulation}
#app{max-width:480px;width:100%;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:14px;min-height:100dvh;position:relative}
#app::before{content:"Voice Rehab";align-self:flex-start;background:var(--navy);color:#fff;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px;border-radius:3px;box-shadow:0 8px 18px rgba(45,56,70,.14)}
#preview{background:var(--navy);border:0;border-radius:5px;padding:36px 26px;min-height:260px;flex:1 1 310px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow)}
#preview::before{content:"";position:absolute;inset:18px;border:1px solid rgba(255,255,255,.24);border-radius:3px;pointer-events:none}
#preview::after{content:"";position:absolute;width:160px;height:160px;right:-58px;bottom:-58px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
#preview-text{font-size:clamp(28px,8vw,48px);font-weight:800;color:#fff;line-height:1.45;letter-spacing:.02em;overflow-wrap:anywhere;position:relative;z-index:1}
#preview-empty{font-size:15px;color:rgba(255,255,255,.82);line-height:1.7;position:relative;z-index:1}#preview-hint{position:absolute;top:14px;right:16px;font-size:10px;color:rgba(255,255,255,.86);letter-spacing:.12em;font-weight:800}
#hist-card{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;flex:0 0 auto;box-shadow:0 8px 18px rgba(45,56,70,.08)}#hist-head{padding:12px 16px;font-size:11px;color:#5E6A75;background:#E8EEF2;font-weight:800;letter-spacing:.12em;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#hist-clear{font-size:12px;color:#5E6A75;background:#F6F9FA;border:1px solid #DCE5EA;border-radius:3px;cursor:pointer;padding:6px 10px}#hist-list{max-height:130px;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.hitem{display:flex;gap:8px;align-items:baseline;font-size:14px;cursor:pointer;border:0;background:#F8FBFC;border-left:4px solid #DCE5EA;border-radius:3px;text-align:left;color:inherit;width:100%;padding:10px}.htime{color:#7E8B96;font-size:10px;min-width:36px;font-weight:800}.hbody{color:var(--ink);line-height:1.4;overflow-wrap:anywhere}#hist-empty{color:var(--muted);font-size:13px}
#bottom-controls{margin-top:auto;position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(238,243,246,0),rgba(238,243,246,.94) 20%,rgba(238,243,246,.99));padding:12px 0 calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#input-label{font-size:12px;color:#61707E;font-weight:700;letter-spacing:.05em;padding:0 2px}#input-row{display:flex;gap:10px;align-items:flex-end}
#voice-input{flex:1;min-width:0;font-size:16px;padding:16px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink);resize:none;line-height:1.5;outline:none;height:60px;min-height:60px;max-height:120px;overflow-y:auto;box-shadow:0 8px 18px rgba(45,56,70,.08)}
#voice-input::placeholder{color:#A6B1BA}#voice-input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(22,185,201,.14),0 8px 18px rgba(45,56,70,.08)}
#send-btn{flex:0 0 60px;width:60px;height:60px;border-radius:5px;border:0;background:var(--orange);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(255,138,61,.22)}#send-btn:disabled{opacity:.42;cursor:default;box-shadow:none}
#mic-area{display:flex;flex-direction:column;gap:8px}
#mic-btn{width:100%;min-height:84px;border:0;border-radius:5px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;gap:13px;font-size:21px;font-weight:900;letter-spacing:.03em;cursor:pointer;box-shadow:0 14px 26px rgba(22,185,201,.25);transition:transform .12s,box-shadow .12s,background .2s}
#mic-btn:active{transform:translateY(3px);box-shadow:0 8px 16px rgba(22,185,201,.2)}#mic-btn.listening{background:var(--orange);color:#fff;box-shadow:0 14px 26px rgba(255,138,61,.25);animation:pulse 1.3s ease-in-out infinite}
#mic-icon{width:30px;height:30px;flex:0 0 auto}#mic-status{min-height:22px;font-size:13px;color:#61707E;text-align:center;line-height:1.45;padding:0 4px;font-weight:600}#mic-status.error{color:#D94F45;font-weight:700}
@keyframes pulse{50%{filter:brightness(1.12)}}@media(prefers-reduced-motion:reduce){#mic-btn{transition:none}#mic-btn.listening{animation:none}}
#fullscreen{display:none;position:fixed;inset:0;background:var(--navy);z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:32px;cursor:pointer}#fullscreen.show{display:flex}
#fs-text{font-size:clamp(38px,11vw,84px);font-weight:900;color:#fff;line-height:1.28;text-align:center;letter-spacing:.02em;overflow-wrap:anywhere}#fs-accent{width:62px;height:4px;background:#fff;margin:24px auto 0;border-radius:2px;opacity:.8}#fs-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,.78);font-weight:800;letter-spacing:.12em}
</style>
</head>
<body>
<main id="app">
  <div id="preview" role="button" tabindex="0" aria-label="表示中の文字を全画面で開く">
    <span id="preview-empty">マイクで話すか、下の欄に入力してください</span>
    <span id="preview-text" hidden></span><span id="preview-hint" hidden>タップで全画面</span>
  </div>
  <section id="hist-card" aria-label="会話履歴"><div id="hist-head"><span>会話履歴</span><button id="hist-clear" type="button">全消去</button></div><div id="hist-list"><span id="hist-empty">まだ履歴がありません</span></div></section>
  <section id="bottom-controls" aria-label="入力操作">
    <div id="input-label">文字入力・キーボードのマイクも使えます</div>
    <div id="input-row">
      <textarea id="voice-input" placeholder="ここに入力、またはキーボードの🎙️を使用" rows="1" aria-label="表示する文字"></textarea>
      <button id="send-btn" type="button" aria-label="確定して全画面表示" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0D1B2A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
    </div>
    <section id="mic-area" aria-label="音声入力">
      <button id="mic-btn" type="button" aria-pressed="false">
        <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path></svg>
        <span id="mic-label">マイクで話す</span>
      </button>
      <p id="mic-status" role="status" aria-live="polite">タップすると音声入力を開始します</p>
    </section>
  </section>
</main>
<div id="fullscreen" role="dialog" aria-modal="true" aria-label="文字の全画面表示"><div id="fs-text"></div><div id="fs-accent"></div><div id="fs-hint">タップして戻る</div></div>
<script>
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let currentText='',history=[],recognition=null,isListening=false,recognitionBase='',finalTranscript='',fullscreenText='',saveOnFullscreenClose=false;
const preview=document.getElementById('preview'),previewEmpty=document.getElementById('preview-empty'),previewText=document.getElementById('preview-text'),previewHint=document.getElementById('preview-hint'),voiceInput=document.getElementById('voice-input'),sendBtn=document.getElementById('send-btn'),micBtn=document.getElementById('mic-btn'),micLabel=document.getElementById('mic-label'),micStatus=document.getElementById('mic-status'),histList=document.getElementById('hist-list'),histEmpty=document.getElementById('hist-empty'),fsText=document.getElementById('fs-text'),fullscreen=document.getElementById('fullscreen');
function timeNow(){return new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}
function joinText(base,addition){return [base,addition].filter(Boolean).join(base&&addition?' ':'');}
function resizeInput(){voiceInput.style.height='60px';voiceInput.style.height=Math.min(voiceInput.scrollHeight,120)+'px';}
function updateSendState(){sendBtn.disabled=!voiceInput.value.trim();}
function resetDisplay(){currentText='';previewEmpty.hidden=false;previewText.hidden=true;previewHint.hidden=true;previewText.textContent='';}
function setDisplay(text){currentText=text;previewEmpty.hidden=true;previewText.hidden=false;previewHint.hidden=false;previewText.textContent=text;}
function updateDraft(text){voiceInput.value=text;resizeInput();updateSendState();if(text.trim())setDisplay(text.trim());else resetDisplay();}
function addHistory(text,src){const clean=text.trim();if(!clean)return;history.unshift({text:clean,src:src,time:timeNow()});renderHistory();}
function renderHistory(){histList.querySelectorAll('.hitem').forEach(function(element){element.remove();});histEmpty.hidden=history.length>0;history.forEach(function(item){const button=document.createElement('button'),time=document.createElement('span'),body=document.createElement('span');button.type='button';button.className='hitem';time.className='htime';body.className='hbody';time.textContent=item.time;body.textContent='● '+item.text;button.append(time,body);button.addEventListener('click',function(){setDisplay(item.text);openFullscreen(false);});histList.appendChild(button);});}
function finishCurrentText(){const text=fullscreenText.trim();if(text){addHistory(text,'input');}voiceInput.value='';resizeInput();updateSendState();resetDisplay();setMicState(false,'会話履歴に追加しました。次の入力ができます。',false);}
function submitText(){const text=voiceInput.value.trim();if(!text)return;if(isListening)stopListening();setDisplay(text);openFullscreen(true);}
function openFullscreen(saveAfterClose){if(!currentText)return;fullscreenText=currentText;saveOnFullscreenClose=Boolean(saveAfterClose);fsText.textContent=currentText;fullscreen.classList.add('show');}
function closeFullscreen(){fullscreen.classList.remove('show');if(saveOnFullscreenClose)finishCurrentText();saveOnFullscreenClose=false;fullscreenText='';}
function clearAll(){history=[];renderHistory();resetDisplay();voiceInput.value='';resizeInput();updateSendState();}
function setMicState(listening,message,isError){isListening=listening;micBtn.classList.toggle('listening',listening);micBtn.setAttribute('aria-pressed',String(listening));micLabel.textContent=listening?'聞き取りを終了':'マイクで話す';micStatus.textContent=message;micStatus.classList.toggle('error',Boolean(isError));}
function speechErrorMessage(error){const messages={'not-allowed':'マイクが許可されていません。iPhoneの設定からSafariのマイクを許可してください。','service-not-allowed':'音声認識を利用できません。下の入力欄、またはキーボードのマイクをお使いください。','audio-capture':'マイクを使用できません。ほかのアプリがマイクを使っていないか確認してください。','no-speech':'声を聞き取れませんでした。もう一度お試しください。','network':'通信状態を確認して、もう一度お試しください。','language-not-supported':'日本語の音声認識を利用できません。キーボードのマイクをお使いください。'};return messages[error]||'音声認識を終了しました。もう一度お試しください。';}
function createRecognition(){if(!SpeechRecognition)return null;const instance=new SpeechRecognition();instance.lang='ja-JP';instance.continuous=false;instance.interimResults=true;instance.maxAlternatives=1;instance.onstart=function(){setMicState(true,'聞いています。ゆっくりお話しください。');};instance.onresult=function(event){let interim='';for(let index=event.resultIndex;index<event.results.length;index++){const transcript=event.results[index][0].transcript;if(event.results[index].isFinal)finalTranscript+=transcript;else interim+=transcript;}updateDraft(joinText(recognitionBase,(finalTranscript+interim).trim()));micStatus.textContent=interim?'聞き取り中…':'文字に変換しました。内容を確認して確定してください。';};instance.onerror=function(event){if(event.error==='aborted')return;setMicState(false,speechErrorMessage(event.error),true);};instance.onend=function(){const hasResult=Boolean(finalTranscript.trim());if(isListening)setMicState(false,hasResult?'文字に変換しました。内容を確認して確定してください。':'音声入力が終了しました。');};return instance;}
function startListening(){if(!SpeechRecognition){voiceInput.focus();setMicState(false,'このiPhoneでは専用マイクを利用できません。キーボードのマイクをお使いください。',true);return;}recognitionBase=voiceInput.value.trim();finalTranscript='';recognition=createRecognition();setMicState(true,'マイクを準備しています…');try{recognition.start();}catch(error){setMicState(false,'少し待ってから、もう一度マイクをタップしてください。',true);}}
function stopListening(){if(recognition&&isListening){micStatus.textContent='文字に変換しています…';recognition.stop();}}
function toggleListening(){isListening?stopListening():startListening();}
micBtn.addEventListener('click',toggleListening);sendBtn.addEventListener('click',submitText);preview.addEventListener('click',function(){openFullscreen(true);});preview.addEventListener('keydown',function(event){if(event.key==='Enter'||event.key===' '){event.preventDefault();openFullscreen(true);}});fullscreen.addEventListener('click',closeFullscreen);document.getElementById('hist-clear').addEventListener('click',clearAll);voiceInput.addEventListener('keydown',function(event){if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitText();}});voiceInput.addEventListener('input',function(){resizeInput();updateSendState();if(voiceInput.value.trim())setDisplay(voiceInput.value.trim());else resetDisplay();});document.addEventListener('visibilitychange',function(){if(document.hidden&&isListening&&recognition)recognition.abort();});
if(!SpeechRecognition)micStatus.textContent='専用マイクが使えない場合も、下の入力欄とキーボードのマイクを利用できます。';
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
<!-- release: navy-preview-muted-history -->
</body>
</html>
